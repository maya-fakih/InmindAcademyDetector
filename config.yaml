# frcnn-amir-recipe: Amir's actual winning model (exp/03-recipe, EXPERIMENTS.md
# "slimB"), verified against his real code and experiment log, not the
# fasterrcnn_mobilenet_v3_large_320_fpn guess this file previously had (that
# never matched his reported 7,051,673 params / 19.238 GFLOPs -- see git log).
# There is no ThunderNet/CEM/SAM anywhere in his repo; his recipe is plain
# slim_mobilenet_fpn already registered in models/baseline.py, just not
# selected here before now. Validation split deliberately does NOT mirror his
# (or match the frcnn-mobilenetv3-augment demo's runtime-coupled trick) --
# see dataset.py for the proportional-to-test-distribution split actually
# used, and RESULTS.md for why.

data:
  raw_dir: dataset

model:
  # slim_mobilenet_fpn (12,16)/128/512, 800px -- Amir's EXPERIMENTS.md "slimB",
  # his best result: 7,051,673 params, 19.238 GFLOPs, 0.2929 test mAP@0.5.
  name: slim_mobilenet_fpn
  stages: [12, 16]
  fpn_channels: 128
  representation_size: 512
  min_size: 800

train:
  epochs: 30
  test_eval_every: 10  # runs held-out subsets-1/4 eval every N epochs, logged as "[TEST subsets 1/4]"
  augment: true        # horizontal flip + photometric jitter (dataset.py's _augment), train split only
  schedule: cosine      # warmup then cosine decay, stepped per batch
  warmup_fraction: 0.05
  batch_size: 4
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 2
  seed: 0

output_dir: runs/baseline

wandb:
  enabled: false
  project: inmind-loco-detection
  entity: null
