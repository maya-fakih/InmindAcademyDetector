# frcnn-amir-recipe: mirrors Amir's exp/03-recipe branch end to end
# (https://github.com/amiroo-star/inmind-detector) -- teammate collaboration,
# disclosed for the presentation. Train on subsets 2+5, validate on the
# whole of subset 3 (unseen-warehouse holdout), test on 1+4. Model, augment,
# and LR schedule below match his config; this branch adds `test_eval_every`
# (periodic held-out test monitoring) and `history.json` logging on top,
# which his branch doesn't have. See dataset.py, train.py and RESULTS.md.

data:
  raw_dir: dataset

model:
  # fasterrcnn_mobilenet_v3_large_fpn      18.97M params, 42.3 GFLOPs  (repo baseline)
  # fasterrcnn_mobilenet_v3_large_320_fpn  18.97M params,  6.8 GFLOPs  (Amir's recipe -- lighter, 320px input)
  name: fasterrcnn_mobilenet_v3_large_320_fpn

train:
  epochs: 40          # Amir's config; his reported 26%/test figure was from an earlier
                       # 20-epoch run of his -- see RESULTS.md, not reproduced here yet.
  test_eval_every: 10  # runs held-out subsets-1/4 eval every N epochs, logged as "[TEST subsets 1/4]"
  augment: true        # horizontal flip + photometric jitter (dataset.py's _augment), train split only
  schedule: cosine      # warmup then cosine decay, stepped per batch
  warmup_fraction: 0.05
  batch_size: 4
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 2
  seed: 0

output_dir: runs/baseline

wandb:
  enabled: false
  project: inmind-loco-detection
  entity: null
