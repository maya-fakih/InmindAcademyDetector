data:
  raw_dir: dataset

model:
  # yolo26s.pt, not yolo26n.pt -- this branch is named "yolo26s-coco" but the
  # results/config it actually ran (yolo26n-coco-*) were nano the whole time.
  # There was no `model:` section here at all; create_yolo_model()'s default
  # ("yolo26n.pt") silently filled in. This branch exists specifically to run
  # the real small variant. See README's Pareto rule -- yolo26s has more
  # capacity than the 2.5M-param nano that plateaued at eval mAP@0.5 0.156,
  # but check its reported params/GFLOPs after the first eval.py run stay
  # under the Faster R-CNN baseline (18,950,729 params / 23.825 GFLOPs) to
  # remain Pareto-eligible -- not hard-coded here since eval.py measures it
  # directly.
  checkpoint: yolo26s.pt

train:
  epochs: 100  # 50-epoch first shot earned it: test mAP@0.5 0.2101, up from nano's 0.1559. Growing to 100.
  batch_size: 4
  learning_rate: 0.005
  lr_final_fraction: 0.01
  warmup_epochs: 3
  # SGDR-style warm restart on resume: --resume last past epoch 100 ramps LR back
  # up to 30% of base_lr over 5 epochs (not the full base_lr -- the model already
  # converged somewhat, a full jump risks the loss-explosion instability seen on
  # yolov4t-loco when unfrozen params met a too-high LR) then cosine-decays to
  # epoch 200. No effect on a fresh run or a plain same-target-epoch resume.
  restart_peak_lr_fraction: 0.3
  restart_warmup_epochs: 5
  freeze_backbone_epochs: 5
  freeze_backbone_layers: 11
  momentum: 0.9
  weight_decay: 0.0005
  # was 0 -- serialized data loading was a known bottleneck (see Handoff.md
  # "Known infra fix needed") that never got fixed. 2 matches Colab's typical
  # free-tier 2-vCPU allocation; raise if a bigger runtime is available.
  # 0, not 2 -- yolo26s (9.5M params) plus 2 worker processes plus
  # background_swap's extra image loads OOM-killed on Colab free-tier RAM
  # (RuntimeError: DataLoader worker killed by signal: Killed, epoch 2/50).
  # This is Colab resource pressure, not a code bug -- nano at num_workers=2
  # never hit this. Costs data-loading throughput (serialized again), but
  # that's the direct tradeoff for not OOMing with the bigger model here.
  # Raise back to 2 if you get a bigger-RAM Colab runtime.
  num_workers: 0
  seed: 0

augment:
  enabled: true
  background_swap_prob: 0.6  # bumped from 0.5 -- val/test gap (0.35 vs 0.156) points at
                              # background/warehouse-specific overfitting; this augmentation
                              # is the one most directly aimed at that gap
  hflip_prob: 0.5
  scale_jitter_prob: 0.5
  color_jitter_prob: 0.5

output_dir: runs/baseline

wandb:
  enabled: false
  project: inmind-loco-detection
  entity: null
