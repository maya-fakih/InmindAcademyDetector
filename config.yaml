data:
  raw_dir: dataset

train:
  epochs: 50
  test_eval_every: 10  # runs held-out subsets-1/4 eval every N epochs, logged as "[TEST subsets 1/4]"
  batch_size: 4
  learning_rate: 0.005
  lr_final_fraction: 0.01
  warmup_epochs: 3
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 2
  seed: 0

augment:
  enabled: true
  background_swap_prob: 0.6
  hflip_prob: 0.5
  scale_jitter_prob: 0.5
  color_jitter_prob: 0.5

output_dir: runs/baseline

wandb:
  enabled: false
  project: inmind-loco-detection
  entity: null
