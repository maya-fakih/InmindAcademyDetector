data:
  raw_dir: dataset

model:
  # yolo26s (small), per the ask for this branch -- not yolo26n. Matches
  # yolo26s-small-coco's choice, just on the alternate 2/3/5-train/4-val/1-test
  # split (see dataset.py's SUBSET_FILES comment) instead of the default split.
  checkpoint: yolo26s.pt

train:
  epochs: 100  # fresh run on a new split -- no prior checkpoint to extend from
  batch_size: 4
  learning_rate: 0.005
  lr_final_fraction: 0.01
  warmup_epochs: 3
  freeze_backbone_epochs: 5
  freeze_backbone_layers: 11
  momentum: 0.9
  weight_decay: 0.0005
  # 0, not 2 -- yolo26s (9.5M params) OOM'd on Colab free-tier RAM at
  # num_workers=2 during the yolo26s-small-coco run (DataLoader worker killed
  # by signal: Killed, epoch 2/50). Same model size here, so starting from
  # that known-good value instead of re-discovering it. Raise if run on a
  # bigger-RAM Colab runtime.
  num_workers: 0
  seed: 0

augment:
  enabled: true
  background_swap_prob: 0.6  # bumped from 0.5 -- val/test gap (0.35 vs 0.156) points at
                              # background/warehouse-specific overfitting; this augmentation
                              # is the one most directly aimed at that gap
  hflip_prob: 0.5
  scale_jitter_prob: 0.5
  color_jitter_prob: 0.5

output_dir: runs/baseline

wandb:
  enabled: false
  project: inmind-loco-detection
  entity: null
